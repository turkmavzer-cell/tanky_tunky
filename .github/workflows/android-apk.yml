name: Android APK

on:
  push:
    branches: [main, 'claude/**', 'fix/**', 'phase/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 requires JDK 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # android/app/build.gradle signs debug builds with keystore/debug.keystore directly; the copy below only
      # keeps any other tool that looks at ~/.android on the same key.
      - name: Install persistent debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_NAME="$(node -p "require('../package.json').version")-debug.${{ github.run_number }}" ./gradlew assembleDebug --no-daemon

      # Fails the build if the APK is not signed with the committed debug key, so an APK that could not
      # update the installed game ("paket çakışıyor") never reaches the phone.
      - name: Verify APK signature (committed debug key)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          WANT=$(tr -d ' \n' < keystore/debug.sha256)
          echo "### APK signer SHA-256: \`$GOT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### versionCode: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK signed with $GOT, expected $WANT (keystore/debug.sha256)"; exit 1; fi

      - name: APK size budget (< 40 MB)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $((SIZE/1024)) KiB"
          echo "### APK size: $((SIZE/1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt 41943040

      - uses: actions/upload-artifact@v4
        with:
          name: tanky-tunky-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
